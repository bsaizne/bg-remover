name: Mac Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # 手动触发

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      max-parallel: 1          # 串行:先 macos-14(arm64),再 macos-13(x86_64),避免资源竞争被 cancel
      matrix:
        os: [macos-14, macos-13]   # Apple Silicon 优先
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system ffmpeg
        run: brew install ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip 2>&1 | tail -3
          pip install "onnxruntime==1.23.0" opencv-python-headless numpy Pillow PySide6 imageio-ffmpeg requests psutil pyinstaller 2>&1 | tail -10
          echo "=== deps installed ==="

      - name: Download models (must run before selftest)
        run: |
          python -c "
          import sys, os, requests, traceback
          from pathlib import Path
          sys.path.insert(0, 'src')
          from bgremover.core.config import models_dir
          from bgremover.core import model_store
          mdir = models_dir()
          mdir.mkdir(parents=True, exist_ok=True)
          urls = {
              'image': 'https://github.com/danielgatis/rembg/releases/download/v0.0.0/isnet-general-use.onnx',
              'video': 'https://github.com/PeterL1n/RobustVideoMatting/releases/download/v1.0.0/rvm_mobilenetv3_fp32.onnx',
          }
          for purpose, url in urls.items():
              dest = mdir / model_store.model_name(purpose)
              if not dest.exists() or dest.stat().st_size < 1_000_000:
                  print(f'Downloading {purpose}: {url}')
                  r = requests.get(url, stream=True, timeout=600)
                  r.raise_for_status()
                  total = int(r.headers.get('content-length', 0))
                  got = 0
                  with open(dest, 'wb') as f:
                      for chunk in r.iter_content(65536):
                          f.write(chunk); got += len(chunk)
                  print(f'{purpose}: {got}/{total} bytes, ok={got==total}')
              else:
                  print(f'{purpose} exists: {dest.stat().st_size} bytes')
          # Verify
          for purpose in ('image','video'):
              dest = mdir / model_store.model_name(purpose)
              assert dest.exists() and dest.stat().st_size > 1_000_000, f'{purpose} model missing'
          print('Models ready')
          " 2>&1

      - name: Selftest (verify CoreML)
        shell: bash
        timeout-minutes: 10
        run: |
          set -e
          echo "=== 1. Basic imports ==="
          python -c "import onnxruntime; print('onnxruntime:', onnxruntime.__version__); print('providers:', onnxruntime.get_available_providers())" 2>&1
          python -c "import cv2; print('cv2:', cv2.__version__)" 2>&1
          python -c "import numpy; print('numpy:', numpy.__version__)" 2>&1
          echo "=== 2. bgremover imports ==="
          PYTHONPATH=src python -c "
          from bgremover.core import config, model_store, matting, rvm, ffmpeg_tool, util, image_pipeline, video_pipeline
          print('core imports OK')
          " 2>&1
          echo "=== 3. ISNet selftest ==="
          PYTHONPATH=src python -c "
          import sys, numpy as np, cv2
          from bgremover.core import matting, model_store
          mp = model_store.resolve_model_path()
          assert mp.exists(), f'image model missing: {mp}'
          matting.init_worker(str(mp))
          img = np.zeros((256, 256, 3), dtype=np.uint8)
          img[:, :] = (0, 0, 200)
          cv2.circle(img, (128, 128), 60, (255, 255, 255), -1)
          rgba, alpha = matting.remove_bg(img, 'auto')
          center = int(alpha[128, 128]); corner = int(alpha[5, 5])
          ok = center > 200 and corner < 50
          print(f'ISNet: center_alpha={center} corner_alpha={corner} -> {\"OK\" if ok else \"FAIL\"}')
          sys.exit(0 if ok else 1)
          " 2>&1
          echo "=== 4. RVM selftest ==="
          PYTHONPATH=src timeout 120 python -c "
          import sys, numpy as np
          from bgremover.core import rvm, model_store
          mp = model_store.resolve_model_path('video')
          assert mp.exists(), f'video model missing: {mp}'
          sess = rvm.build_session(str(mp), prefer_gpu=False, timeout=10)
          h, w = 128, 128
          rgb = np.random.rand(h, w, 3).astype(np.float32)
          states = rvm.initial_states(sess, h, w)
          fgr, pha, states2 = rvm.infer(sess, rgb, states)
          assert fgr.shape == (3, h, w) and pha.shape == (1, h, w)
          assert np.isfinite(fgr).all() and np.isfinite(pha).all()
          print(f'RVM: backend={rvm.video_backend()} fgr={fgr.shape} pha={pha.shape} -> OK')
          " 2>&1
          echo "=== 5. multiprocessing ==="
          python -c "
          from multiprocessing import Pool
          def ok(x): return x*2
          with Pool(2) as p: r = p.map(ok, [1,2])
          assert r == [2,4]; print('multiprocessing OK')
          " 2>&1
          echo "=== 6. ffmpeg ==="
          PYTHONPATH=src python -c "
          import sys
          from bgremover.core import ffmpeg_tool as ff
          fp = ff.locate_ffmpeg()
          enc = ff.check_encoders(fp)
          ok = all(enc.values())
          print(f'ffmpeg: {fp} encoders={enc} -> {\"OK\" if ok else \"FAIL\"}')
          sys.exit(0 if ok else 1)
          " 2>&1
          echo "=== SELFTEST ALL PASSED ==="

      - name: Build macOS app
        run: |
          pyinstaller --noconfirm --clean bgremover.spec 2>&1 | tail -30
          echo "=== Build complete ==="
          ls -la dist/ 2>&1 || echo "dist/ not found"

      - name: Package zip
        run: |
          PYTHONPATH=src python make_zip.py
          ls -lh dist/*.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AI抠图-${{ matrix.os == 'macos-14' && 'arm64' || 'x86_64' }}
          path: dist/*.zip
