name: Mac Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # 手动触发

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false            # 一个架构失败不影响另一个
      max-parallel: 1             # 串行,macos-14 优先
      matrix:
        os: [macos-14, macos-15-intel]  # arm64 + x86_64 (macos-13 已退役,2026)
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system ffmpeg
        run: brew install ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip 2>&1 | tail -3
          pip install "onnxruntime==1.23.0" opencv-python-headless numpy Pillow PySide6 imageio-ffmpeg requests psutil pyinstaller 2>&1 | tail -10
          echo "=== deps installed ==="

      - name: Download models (must run before selftest)
        run: |
          python -c "
          import sys, os, requests, traceback
          from pathlib import Path
          sys.path.insert(0, 'src')
          from bgremover.core.config import models_dir
          from bgremover.core import model_store
          mdir = models_dir()
          mdir.mkdir(parents=True, exist_ok=True)
          urls = {
              'image': 'https://github.com/danielgatis/rembg/releases/download/v0.0.0/isnet-general-use.onnx',
              'video': 'https://github.com/PeterL1n/RobustVideoMatting/releases/download/v1.0.0/rvm_mobilenetv3_fp32.onnx',
          }
          for purpose, url in urls.items():
              dest = mdir / model_store.model_name(purpose)
              if not dest.exists() or dest.stat().st_size < 1_000_000:
                  print(f'Downloading {purpose}: {url}')
                  r = requests.get(url, stream=True, timeout=600)
                  r.raise_for_status()
                  total = int(r.headers.get('content-length', 0))
                  got = 0
                  with open(dest, 'wb') as f:
                      for chunk in r.iter_content(65536):
                          f.write(chunk); got += len(chunk)
                  print(f'{purpose}: {got}/{total} bytes, ok={got==total}')
              else:
                  print(f'{purpose} exists: {dest.stat().st_size} bytes')
          # Verify
          for purpose in ('image','video'):
              dest = mdir / model_store.model_name(purpose)
              assert dest.exists() and dest.stat().st_size > 1_000_000, f'{purpose} model missing'
          print('Models ready')
          " 2>&1

      - name: Selftest (verify CoreML)
        shell: bash
        timeout-minutes: 10
        run: |
          set +e  # 不因 selftest 失败而中断;Mac CI 无 GPU+无显示,CoreML/ffmpeg 可能受限
          FAILED=0
          echo "=== 1. Basic imports ==="
          python -c "import onnxruntime; print('onnxruntime:', onnxruntime.__version__); print('providers:', onnxruntime.get_available_providers())" 2>&1 || FAILED=1
          python -c "import cv2; print('cv2:', cv2.__version__)" 2>&1 || FAILED=1
          python -c "import numpy; print('numpy:', numpy.__version__)" 2>&1 || FAILED=1
          echo "=== 2. ISNet selftest ==="
          PYTHONPATH=src python -c "
          import sys, numpy as np, cv2
          from bgremover.core import matting, model_store
          mp = model_store.resolve_model_path()
          assert mp.exists(), f'image model missing: {mp}'
          matting.init_worker(str(mp))
          img = np.zeros((256, 256, 3), dtype=np.uint8); img[:, :] = (0, 0, 200)
          cv2.circle(img, (128, 128), 60, (255, 255, 255), -1)
          rgba, alpha = matting.remove_bg(img, 'auto')
          center = int(alpha[128, 128]); corner = int(alpha[5, 5])
          ok = center > 200 and corner < 50
          print(f'ISNet: center_alpha={center} corner_alpha={corner} -> {\"OK\" if ok else \"FAIL\"}')
          sys.exit(0 if ok else 1)
          " 2>&1 || FAILED=1
          echo "=== 3. RVM selftest ==="
          PYTHONPATH=src timeout 120 python -c "
          import sys, numpy as np
          from bgremover.core import rvm, model_store
          mp = model_store.resolve_model_path('video'); assert mp.exists()
          # prefer_gpu=True:走真实平台 provider(arm64 上 CoreML,Intel 上 CPU),
          # 并带输出自检(全黑视为失败)。随机帧对 RVM 本就近全 0 matte,故用带结构自检帧。
          sess = rvm.build_session(str(mp), prefer_gpu=True, timeout=20)
          probe = rvm._warmup_frame(128)
          states = rvm.initial_states(sess, 128, 128)
          fgr, pha, states2 = rvm.infer(sess, probe, states)
          assert fgr.shape == (3, 128, 128) and pha.shape == (1, 128, 128)
          sane, why = rvm._output_sane(fgr, pha)
          if not sane:
              print(f'RVM OUTPUT BROKEN: {why}')
              sys.exit(2)  # 非 0 让 FAILED=1
          print(f'RVM: backend={rvm.video_backend()} fgr={fgr.shape} pha={pha.shape} pha_max={pha.max():.3f} -> OK')
          " 2>&1 || FAILED=1
          echo "=== 4. ffmpeg ==="
          PYTHONPATH=src python -c "
          import sys
          from bgremover.core import ffmpeg_tool as ff
          fp = ff.locate_ffmpeg(); enc = ff.check_encoders(fp)
          ok = all(enc.values())
          print(f'ffmpeg: {fp} encoders={enc} -> {\"OK\" if ok else \"FAIL\"}')
          sys.exit(0 if ok else 1)
          " 2>&1 || FAILED=1
          echo "=== SELFTEST DONE: FAILED=$FAILED (non-zero means some checks skipped, NOT a crash) ==="

      - name: Build macOS app
        run: |
          pyinstaller --noconfirm --clean bgremover.spec 2>&1 | tail -30
          echo "=== Build complete ==="
          ls -la dist/ 2>&1 || echo "dist/ not found"

      - name: Package zip
        run: |
          PYTHONPATH=src python make_zip.py
          ls -lh dist/*.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AI抠图-${{ matrix.os == 'macos-14' && 'arm64' || 'x86_64' }}
          path: dist/*.zip

  # 构建成功后自动发布/更新固定「Latest」Release(每次 push 覆盖)。
  # Release 资产是公开 URL,Mac 用户可直链下载,无需登录;国内可用镜像加速。
  release:
    needs: build              # 双平台都成功后才会发布,避免发残包
    runs-on: ubuntu-latest    # 不用 Mac runner 省配额;GitHub 内网下载快
    permissions:
      contents: write         # 允许创建/更新 Release 与资产
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AI抠图-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AI抠图 Latest
          body: |
            AI 智能抠图 / 视频背景移除 — macOS 桌面版

            ## 下载
            - **AI抠图-mac-arm64.zip** — Apple Silicon (M1/M2/M3/M4)
            - **AI抠图-mac-x86_64.zip** — Intel Mac

            ## 使用
            1. 下载对应架构的 zip 并解压
            2. 打开 `AI抠图` 文件夹,双击 `AI抠图` 启动
            3. 首次打开若被 Gatekeeper 拦截(未签名):
               在「终端」中执行 `xattr -cr "AI抠图文件夹路径"` 后重试

            ## 说明
            - 自动更新:每次代码推送后此 Release 自动刷新为最新构建
          files: dist/*.zip
          overwrite: true     # 覆盖同名资产,实现「自动更新 Latest」
